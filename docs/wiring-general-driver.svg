<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" font-family="Helvetica, Arial, sans-serif">
  <rect width="1500" height="1120" fill="#ffffff"/>
  <text x="750" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Bimo biped — wiring on the General Driver for Robots</text>
  <text x="750" y="52" text-anchor="middle" font-size="11" fill="#6b7280">Every connection uses an existing connector. No soldering to the board. Nets: V+ red · GND black · DATA blue · I²C blue/amber</text>

  <!-- ================= BATTERY COLUMN ================= -->
  <rect x="30" y="76" width="280" height="470" rx="10" fill="#fef7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="170" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Pack &amp; power conditioning</text>

  <!-- pack -->
  <rect x="50" y="112" width="240" height="74" rx="6" fill="#ffffff" stroke="#9a3412"/>
  <text x="62" y="132" font-size="11" font-weight="bold" fill="#1f2937">BT1 · 3S LiPo 850 mAh</text>
  <text x="62" y="148" font-size="9" fill="#6b7280">11.1 V nom · 12.6 V full · never 11.4 V HV</text>
  <text x="62" y="162" font-size="9" fill="#6b7280">XT30 main lead · JST-XH balance lead</text>
  <text x="62" y="177" font-size="9" fill="#9a3412">BOM item — unchanged by the board swap</text>

  <!-- balance -> alarm -->
  <line x1="170" y1="186" x2="170" y2="208" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="50" y="208" width="240" height="52" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="62" y="227" font-size="11" font-weight="bold" fill="#14532d">S1 · LiPo low-voltage alarm</text>
  <text x="62" y="242" font-size="9" fill="#4b5563">on the balance lead · per-cell · 3.3 V/cell</text>
  <text x="62" y="254" font-size="9" fill="#16a34a">STILL REQUIRED — only firmware-independent guard</text>

  <!-- XT30 -->
  <line x1="170" y1="186" x2="170" y2="278" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="112" y="278" width="116" height="30" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="170" y="297" text-anchor="middle" font-size="10" fill="#92400e">XT30 pigtail</text>

  <!-- fuse -->
  <line x1="170" y1="308" x2="170" y2="330" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="50" y="330" width="240" height="50" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="62" y="349" font-size="11" font-weight="bold" fill="#14532d">S2 + S3 · inline mini-blade fuse, 15 A</text>
  <text x="62" y="364" font-size="9" fill="#4b5563">dead-short protection · board has no fuse</text>
  <text x="62" y="376" font-size="9" fill="#16a34a">STILL REQUIRED</text>

  <!-- bulk cap -->
  <line x1="170" y1="380" x2="170" y2="402" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="50" y="402" width="240" height="60" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="62" y="421" font-size="11" font-weight="bold" fill="#92400e">S4 · 470–1000 µF, 25 V low-ESR</text>
  <text x="62" y="436" font-size="9" fill="#4b5563">across V+/GND on the pigtail · observe polarity</text>
  <text x="62" y="448" font-size="9" fill="#b45309">STILL WANTED, but see note 4 — pack-side only,</text>
  <text x="62" y="458" font-size="9" fill="#b45309">so it does not shield the input connector itself.</text>

  <!-- XH plug -->
  <line x1="170" y1="462" x2="170" y2="484" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="88" y="484" width="164" height="46" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="170" y="502" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">XH2.54 2-pin plug</text>
  <text x="170" y="517" text-anchor="middle" font-size="9" fill="#92400e">NEW PART — replaces the 5.5×2.1 barrel</text>

  <!-- run to board -->
  <path d="M252 496 H 328 V 196 H 360" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M252 520 H 344 V 214 H 360" fill="none" stroke="#111827" stroke-width="2.5"/>
  <text x="262" y="490" font-size="9" font-weight="bold" fill="#991b1b">V+</text>
  <text x="262" y="536" font-size="9" font-weight="bold" fill="#111827">GND</text>

  <!-- ================= BOARD ================= -->
  <rect x="360" y="76" width="450" height="620" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="585" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">U1 · Waveshare General Driver for Robots</text>
  <text x="585" y="114" text-anchor="middle" font-size="9" fill="#3b5bdb">ESP32-WROOM-32UE · 65 × 65 mm · mounting 49 × 58, Ø3 · DC 7–13 V</text>

  <!-- H1 -->
  <circle cx="360" cy="196" r="5" fill="#c33b2c"/>
  <circle cx="360" cy="214" r="5" fill="#26221f"/>
  <rect x="380" y="176" width="200" height="58" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="390" y="194" font-size="11" font-weight="bold" fill="#1e3a8a">H1 · XH2.54 2-pin power in</text>
  <text x="390" y="209" font-size="9" fill="#4b5563">1 = V+ (VDD_DC_JACK) · 2 = GND</text>
  <text x="390" y="225" font-size="9" fill="#b91c1c">rated 3 A — see note 3</text>

  <!-- internal power chain -->
  <path d="M580 205 H 620" stroke="#c0392b" stroke-width="2"/>
  <rect x="620" y="176" width="170" height="112" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="630" y="194" font-size="10" font-weight="bold" fill="#334155">on-board power path</text>
  <text x="630" y="210" font-size="9" fill="#475569">AO4407 P-FET — reverse polarity</text>
  <text x="630" y="224" font-size="9" fill="#475569">SW1 1P2T — main on/off switch</text>
  <text x="630" y="238" font-size="9" fill="#475569">R11 0.01 Ω shunt → INA219 @ 0x42</text>
  <text x="630" y="254" font-size="9" fill="#b91c1c">INA219 sees pack VOLTAGE (good)</text>
  <text x="630" y="266" font-size="9" fill="#b91c1c">but only buck current — NOT servos</text>
  <text x="630" y="280" font-size="9" fill="#475569">MP8759 buck → 5 V → 3V3</text>

  <!-- DC_IN rail -->
  <path d="M705 288 V 320 H 400 V 470" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="412" y="336" font-size="10" font-weight="bold" fill="#991b1b">DC_IN — raw pack, feeds both servo ports</text>

  <!-- H5 -->
  <rect x="560" y="352" width="230" height="62" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="570" y="370" font-size="11" font-weight="bold" fill="#1e3a8a">H5 · bus servo port A</text>
  <text x="570" y="385" font-size="9" fill="#4b5563">Header 3 — 1 DATA · 2 DC_IN · 3 GND</text>
  <text x="570" y="400" font-size="9" fill="#4b5563">half-duplex TTL, 1 Mbaud, GPIO 18 RX / 19 TX</text>
  <circle cx="810" cy="383" r="5" fill="#2b62c3"/>

  <!-- H6 -->
  <rect x="560" y="428" width="230" height="62" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="570" y="446" font-size="11" font-weight="bold" fill="#1e3a8a">H6 · bus servo port B</text>
  <text x="570" y="461" font-size="9" fill="#4b5563">Header 3 — same three nets, same bus</text>
  <text x="570" y="476" font-size="9" fill="#4b5563">one port per leg halves the per-lead current</text>
  <circle cx="810" cy="459" r="5" fill="#2b62c3"/>

  <path d="M400 470 H 560" stroke="#c0392b" stroke-width="2"/>
  <path d="M400 383 H 560" stroke="#c0392b" stroke-width="2" opacity="0.35"/>

  <!-- P1 IIC -->
  <rect x="380" y="512" width="410" height="76" rx="5" fill="#ffffff" stroke="#93c5fd"/>
  <text x="390" y="530" font-size="11" font-weight="bold" fill="#1e3a8a">P1 · IIC expansion header — Header 4</text>
  <text x="390" y="546" font-size="9" fill="#4b5563">1 = VDD3V3 · 2 = GND · 3 = IIC_SDA · 4 = IIC_SCL</text>
  <text x="390" y="561" font-size="9" fill="#4b5563">SDA = GPIO 32 · SCL = GPIO 33 (not 21/22 — board.h change)</text>
  <text x="390" y="577" font-size="9" fill="#15803d">exactly the BNO085's four wires, in order — plugs straight in</text>
  <circle cx="585" cy="588" r="5" fill="#2b62c3"/>

  <!-- onboard sensors -->
  <rect x="380" y="602" width="410" height="76" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="390" y="620" font-size="11" font-weight="bold" fill="#14532d">Already on this I²C bus (no wiring)</text>
  <text x="390" y="636" font-size="9" fill="#166534">QMI8658C 6-axis @ 0x6B · AK09918C mag @ 0x0C — via LSF0204 level shifter</text>
  <text x="390" y="651" font-size="9" fill="#166534">BMP280 @ 0x77 · INA219 @ 0x42(8-bit)</text>
  <text x="390" y="667" font-size="9" fill="#15803d">BNO085 at 0x4A/0x4B — no address collides. Onboard IMU is the fallback.</text>

  <!-- ================= IMU ================= -->
  <rect x="360" y="722" width="450" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="585" y="744" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">GY-BNO085 breakout (BOM item 18 — already owned)</text>
  <text x="374" y="764" font-size="9" fill="#166534">VIN ← P1 pin 1 (3V3)   ·   GND ← P1 pin 2   ·   SDA ← P1 pin 3   ·   SCL ← P1 pin 4</text>
  <text x="374" y="780" font-size="9" fill="#166534">4-wire cable, ~150 mm. On-chip SH-2 fusion, so the ESP32 does no filtering.</text>
  <text x="374" y="796" font-size="9" fill="#4b5563">Rides the printed imu_carrier at the tower top; RST / INT / CS / SDO / P0 / P1 unconnected.</text>
  <text x="374" y="814" font-size="9" fill="#b45309">Verify P1's physical connector type before ordering the cable — the schematic says only "Header 4".</text>
  <text x="374" y="831" font-size="9" fill="#15803d">If you skip it entirely, the onboard QMI8658C + AK09918C do the same job with host-side fusion.</text>
  <path d="M585 588 V 722" stroke="#2b62c3" stroke-width="2.5"/>

  <!-- ================= SERVOS ================= -->
  <text x="1160" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Servo bus — 10 × ST3215, one leg per port</text>
  <text x="1160" y="114" text-anchor="middle" font-size="9" fill="#6b7280">every connector: middle pin = V+ · stock 150 mm leads unless marked</text>

  <!-- left leg -->
  <rect x="860" y="132" width="270" height="560" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="995" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">LEFT LEG → H5</text>
  <g font-size="10">
    <rect x="880" y="168" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="892" y="184" font-weight="bold" fill="#1f2937">ID 9 · L hip yaw</text>
    <text x="892" y="199" font-size="9" fill="#6b7280">action index 0</text>

    <rect x="880" y="268" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="892" y="284" font-weight="bold" fill="#1f2937">ID 1 · L hip roll</text>
    <text x="892" y="299" font-size="9" fill="#6b7280">action index 1</text>

    <rect x="880" y="368" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="892" y="384" font-weight="bold" fill="#1f2937">ID 2 · L hip pitch</text>
    <text x="892" y="399" font-size="9" fill="#6b7280">action index 2</text>

    <rect x="880" y="468" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="892" y="484" font-weight="bold" fill="#1f2937">ID 3 · L knee</text>
    <text x="892" y="499" font-size="9" fill="#6b7280">action index 3</text>

    <rect x="880" y="568" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="892" y="584" font-weight="bold" fill="#1f2937">ID 4 · L ankle</text>
    <text x="892" y="599" font-size="9" fill="#6b7280">action index 4</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M995 208 V 268"/><path d="M995 308 V 368"/>
    <path d="M995 408 V 468"/><path d="M995 508 V 568"/>
  </g>
  <g font-size="8" fill="#6b7280">
    <text x="1002" y="243">~85 mm routed</text>
    <text x="1002" y="343" fill="#b91c1c" font-weight="bold">170 mm — needs ≥200 mm lead</text>
    <text x="1002" y="443">111 mm routed</text>
    <text x="1002" y="543">82 mm routed</text>
  </g>
  <path d="M810 383 H 830 V 188 H 880" fill="none" stroke="#2b62c3" stroke-width="2.5"/>

  <!-- right leg -->
  <rect x="1190" y="132" width="270" height="560" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1325" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">RIGHT LEG → H6</text>
  <g font-size="10">
    <rect x="1210" y="168" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1222" y="184" font-weight="bold" fill="#1f2937">ID 10 · R hip yaw</text>
    <text x="1222" y="199" font-size="9" fill="#6b7280">action index 5</text>

    <rect x="1210" y="268" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1222" y="284" font-weight="bold" fill="#1f2937">ID 5 · R hip roll</text>
    <text x="1222" y="299" font-size="9" fill="#6b7280">action index 6</text>

    <rect x="1210" y="368" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1222" y="384" font-weight="bold" fill="#1f2937">ID 6 · R hip pitch</text>
    <text x="1222" y="399" font-size="9" fill="#6b7280">action index 7</text>

    <rect x="1210" y="468" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1222" y="484" font-weight="bold" fill="#1f2937">ID 7 · R knee</text>
    <text x="1222" y="499" font-size="9" fill="#6b7280">action index 8</text>

    <rect x="1210" y="568" width="230" height="40" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1222" y="584" font-weight="bold" fill="#1f2937">ID 8 · R ankle</text>
    <text x="1222" y="599" font-size="9" fill="#6b7280">action index 9</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M1325 208 V 268"/><path d="M1325 308 V 368"/>
    <path d="M1325 408 V 468"/><path d="M1325 508 V 568"/>
  </g>
  <g font-size="8" fill="#6b7280">
    <text x="1332" y="243">~85 mm routed</text>
    <text x="1332" y="343" fill="#b91c1c" font-weight="bold">170 mm — needs ≥200 mm lead</text>
    <text x="1332" y="443">111 mm routed</text>
    <text x="1332" y="543">82 mm routed</text>
  </g>
  <path d="M810 459 H 1170 V 188 H 1210" fill="none" stroke="#2b62c3" stroke-width="2.5"/>

  <text x="860" y="712" font-size="9" fill="#6b7280">Servos ship as ID 1 — assign IDs one at a time at bring-up before chaining. Two same-ID servos will not enumerate.</text>
  <text x="860" y="727" font-size="9" fill="#6b7280">GoPro MAX is self-powered: zero wiring to the robot.</text>

  <!-- ================= NOTES ================= -->
  <rect x="30" y="866" width="1440" height="228" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="46" y="890" font-size="12" font-weight="bold" fill="#92400e">Verified against Waveshare's schematic (docs/datasheets/general-driver/) unless marked otherwise</text>
  <g font-size="10" fill="#78350f">
    <text x="46" y="914"><tspan font-weight="bold">1 · Nothing here is soldered to the board.</tspan> Power, both servo legs and the IMU all land in existing connectors. That was the whole point of the swap.</text>
    <text x="46" y="936"><tspan font-weight="bold">2 · The external inline switch is now redundant.</tspan> SW1 on the board is a 1P2T in the input path. Keep the pigtail switch only if you want one you can reach.</text>
    <text x="46" y="958" fill="#991b1b"><tspan font-weight="bold">3 · Input current is the weak point, and it is tighter than the old board.</tspan> H5/H6 tap DC_IN, so ALL servo current flows through the XH2.54 input,</text>
    <text x="62" y="974" fill="#991b1b">the AO4407 and SW1. JST rates XH at 3 A (AWG#22, their datasheet); SW1's rating is not given. Against 1.4 A RMS that is fine — against the</text>
    <text x="62" y="990" fill="#991b1b">6.8 A sim-derived peak it is not. The old board's barrel jack was 5 A, so peak headroom gets worse. Measure it (S5) before trusting either number.</text>
    <text x="46" y="1012"><tspan font-weight="bold">4 · S4's bulk cap can only sit on the pack side</tspan>, so it cuts sag in the pack leads but the transient still crosses H1. Putting it board-side would</text>
    <text x="62" y="1028">mean soldering or giving up a servo port — neither is available. If note 3 bites on the bench, feed servo V+ straight from the pack instead.</text>
    <text x="46" y="1050" fill="#991b1b"><tspan font-weight="bold">5 · The onboard INA219 does NOT replace S5.</tspan> Its 0.01 Ω shunt sits between DC_IN and VIN, i.e. in the buck's feed only; the servo ports tap</text>
    <text x="62" y="1066" fill="#991b1b">DC_IN upstream of it. You gain a pack-voltage sense independent of the servo bus — which fixes battguard's blind spot — but no servo current.</text>
    <text x="46" y="1088"><tspan font-weight="bold">6 · Still unverified:</tspan> P1's physical connector type, whether P1 carries I²C pull-ups, and SW1's current rating. Confirm on the board in hand.</text>
  </g>
</svg>
