<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="800" viewBox="0 0 1150 800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1150" height="800" fill="#ffffff"/>
  <text x="575" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Bimo biped — circuit diagram</text>
  <text x="575" y="49" text-anchor="middle" font-size="11" fill="#6b7280">nets: VBAT red · GND black · DATA blue (one shared half-duplex TTL bus @ 1 Mbaud) — every 3-pin connector: 1 GND · 2 V+ · 3 DATA</text>

  <!-- ============ battery ============ -->
  <g>
    <rect x="35" y="215" width="150" height="120" rx="6" fill="none" stroke="#374151" stroke-width="1.5"/>
    <text x="110" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">BT1 · 3S LiPo</text>
    <!-- three cells in series -->
    <g stroke="#374151" stroke-width="2">
      <line x1="60" y1="245" x2="60" y2="265"/><line x1="70" y1="250" x2="70" y2="260"/>
      <line x1="88" y1="245" x2="88" y2="265"/><line x1="98" y1="250" x2="98" y2="260"/>
      <line x1="116" y1="245" x2="116" y2="265"/><line x1="126" y1="250" x2="126" y2="260"/>
      <line x1="45" y1="255" x2="60" y2="255"/><line x1="70" y1="255" x2="88" y2="255"/>
      <line x1="98" y1="255" x2="116" y2="255"/><line x1="126" y1="255" x2="150" y2="255"/>
    </g>
    <text x="52" y="242" font-size="10" fill="#374151">+</text>
    <text x="112" y="285" font-size="10" fill="#6b7280">Zeee 850 mAh 100C</text>
    <text x="42" y="300" font-size="10" fill="#6b7280">11.1 V nom · 12.6 V full</text>
    <text x="42" y="314" font-size="10" fill="#6b7280">XT30 main · JST-XH balance</text>
    <text x="42" y="328" font-size="10" fill="#9ca3af">(balance lead: charger only)</text>
  </g>
  <!-- XT30 -->
  <rect x="185" y="230" width="34" height="52" rx="4" fill="#fef3c7" stroke="#b45309"/>
  <text x="202" y="224" text-anchor="middle" font-size="9" fill="#92400e">XT30 pair</text>
  <text x="202" y="250" text-anchor="middle" font-size="9" fill="#92400e">1 +</text>
  <text x="202" y="272" text-anchor="middle" font-size="9" fill="#92400e">2 −</text>
  <line x1="150" y1="243" x2="185" y2="243" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="45" y1="255" x2="45" y2="269" stroke="#374151" stroke-width="2"/>
  <line x1="45" y1="269" x2="185" y2="269" stroke="#111827" stroke-width="2.5"/>
  <line x1="150" y1="255" x2="150" y2="243" stroke="#374151" stroke-width="2"/>

  <!-- switch SW1 in + lead -->
  <line x1="219" y1="243" x2="240" y2="243" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="243" cy="243" r="2.5" fill="#c0392b"/>
  <line x1="243" y1="243" x2="266" y2="231" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="269" cy="243" r="2.5" fill="#c0392b"/>
  <line x1="269" y1="243" x2="292" y2="243" stroke="#c0392b" stroke-width="2.5"/>
  <text x="256" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">SW1</text>
  <text x="256" y="212" text-anchor="middle" font-size="9" fill="#92400e">SPST ≥10 A</text>
  <line x1="219" y1="269" x2="292" y2="269" stroke="#111827" stroke-width="2.5"/>

  <!-- DC plug -->
  <rect x="292" y="228" width="36" height="54" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="310" y="222" text-anchor="middle" font-size="9" fill="#4b5563">P1 · DC 5.5×2.1</text>
  <text x="310" y="248" text-anchor="middle" font-size="9" fill="#4b5563">ctr +</text>
  <text x="310" y="272" text-anchor="middle" font-size="9" fill="#4b5563">slv −</text>
  <line x1="328" y1="243" x2="360" y2="243" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="328" y1="269" x2="360" y2="269" stroke="#111827" stroke-width="2.5"/>
  <text x="332" y="292" font-size="9" fill="#6b7280">20 AWG</text>

  <!-- ============ driver board ============ -->
  <g>
    <rect x="360" y="120" width="330" height="480" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="525" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">U1 · Servo Driver with ESP32</text>
    <text x="525" y="158" text-anchor="middle" font-size="9" fill="#3b5bdb">Waveshare · VIN 6–12.6 V · OLED shows VBAT</text>

    <!-- VIN pins -->
    <circle cx="360" cy="243" r="3" fill="#c0392b"/>
    <text x="368" y="240" font-size="9" fill="#7f1d1d">DC-IN + (VBAT)</text>
    <circle cx="360" cy="269" r="3" fill="#111827"/>
    <text x="368" y="281" font-size="9" fill="#374151">DC-IN − (GND)</text>

    <!-- internal blocks -->
    <rect x="380" y="300" width="140" height="44" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="450" y="318" text-anchor="middle" font-size="9" fill="#1f2937">buck 12→5 V</text>
    <text x="450" y="332" text-anchor="middle" font-size="9" fill="#1f2937">+ 3V3 LDO (logic)</text>
    <rect x="380" y="360" width="140" height="90" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="450" y="380" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f2937">ESP32-WROOM-32</text>
    <text x="450" y="396" text-anchor="middle" font-size="8.5" fill="#4b5563">UART0: GPIO1/3 ↔ USB-C (115200)</text>
    <text x="450" y="409" text-anchor="middle" font-size="8.5" fill="#4b5563">UART1: GPIO19 TX / GPIO18 RX</text>
    <text x="450" y="422" text-anchor="middle" font-size="8.5" fill="#4b5563">I2C: GPIO21/22 → OLED</text>
    <text x="450" y="435" text-anchor="middle" font-size="8.5" fill="#4b5563">GPIO23 → RGB LEDs</text>
    <rect x="540" y="380" width="130" height="50" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="605" y="399" text-anchor="middle" font-size="9" fill="#1f2937">half-duplex TTL</text>
    <text x="605" y="412" text-anchor="middle" font-size="9" fill="#1f2937">bus transceiver</text>
    <text x="605" y="425" text-anchor="middle" font-size="8.5" fill="#6b7280">TX/RX ↔ one DATA net</text>
    <line x1="520" y1="405" x2="540" y2="405" stroke="#6b7280" stroke-width="1.5"/>

    <!-- VBAT rail inside: DC+ direct to servo headers -->
    <path d="M360 243 L 640 243 L 640 480" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <text x="548" y="236" font-size="8.5" fill="#b91c1c">VBAT straight to servo bus (unregulated)</text>
    <line x1="450" y1="243" x2="450" y2="300" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="450" y1="344" x2="450" y2="360" stroke="#6b7280" stroke-width="1.5"/>
    <!-- GND rail -->
    <path d="M360 269 L 620 269 L 620 500" fill="none" stroke="#111827" stroke-width="2.5"/>
    <!-- DATA from xcvr -->
    <path d="M605 430 L 605 520 L 660 520" fill="none" stroke="#2563eb" stroke-width="2.5"/>

    <!-- servo headers J2/J3 on right edge -->
    <rect x="660" y="470" width="30" height="60" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="654" y="466" font-size="10" font-weight="bold" fill="#1e3a8a">J2 (port A)</text>
    <circle cx="690" cy="480" r="3" fill="#111827"/><text x="668" y="484" font-size="8" fill="#374151">1 G</text>
    <circle cx="690" cy="500" r="3" fill="#c0392b"/><text x="668" y="504" font-size="8" fill="#7f1d1d">2 V+</text>
    <circle cx="690" cy="520" r="3" fill="#2563eb"/><text x="668" y="524" font-size="8" fill="#1e3a8a">3 D</text>
    <rect x="660" y="545" width="30" height="60" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="654" y="541" font-size="10" font-weight="bold" fill="#1e3a8a">J3 (port B)</text>
    <circle cx="690" cy="555" r="3" fill="#111827"/><text x="668" y="559" font-size="8" fill="#374151">1 G</text>
    <circle cx="690" cy="575" r="3" fill="#c0392b"/><text x="668" y="579" font-size="8" fill="#7f1d1d">2 V+</text>
    <circle cx="690" cy="595" r="3" fill="#2563eb"/><text x="668" y="599" font-size="8" fill="#1e3a8a">3 D</text>
    <!-- J2/J3 paralleled -->
    <line x1="640" y1="480" x2="690" y2="480" stroke="#111827" stroke-width="2"/>
    <line x1="640" y1="500" x2="690" y2="500" stroke="#c0392b" stroke-width="2"/>
    <line x1="660" y1="520" x2="690" y2="520" stroke="#2563eb" stroke-width="2"/>
    <line x1="640" y1="480" x2="640" y2="555" stroke="#111827" stroke-width="2"/>
    <line x1="640" y1="500" x2="640" y2="575" stroke="#c0392b" stroke-width="2"/>
    <line x1="655" y1="520" x2="655" y2="595" stroke="#2563eb" stroke-width="2"/>
    <line x1="640" y1="555" x2="690" y2="555" stroke="#111827" stroke-width="2"/>
    <line x1="640" y1="575" x2="690" y2="575" stroke="#c0392b" stroke-width="2"/>
    <line x1="655" y1="595" x2="690" y2="595" stroke="#2563eb" stroke-width="2"/>
    <circle cx="640" cy="480" r="2.5" fill="#111827"/><circle cx="640" cy="500" r="2.5" fill="#c0392b"/><circle cx="655" cy="520" r="2.5" fill="#2563eb"/>
    <text x="597" y="546" font-size="8.5" fill="#3b5bdb">J2 = J3 (paralleled)</text>

    <!-- USB-C -->
    <rect x="420" y="600" width="60" height="18" rx="4" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="450" y="613" text-anchor="middle" font-size="9" fill="#4b5563">USB-C</text>
    <line x1="450" y1="450" x2="450" y2="600" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <path d="M450 618 C 450 660, 340 660, 300 660" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="160" y="655" font-size="10" fill="#6b7280">laptop: flash / serial bridge @ 115200</text>
  <text x="160" y="669" font-size="10" fill="#6b7280">(runtime control = WiFi or on-board loop)</text>

  <!-- ============ servo chains ============ -->
  <!-- chain A (left leg) top row; chain B (right leg) bottom row -->
  <g font-size="9">
    <!-- row A y=90..170, boxes at x 720,830,940,1050 w=95 h=80 -->
    <text x="712" y="80" font-size="11" font-weight="bold" fill="#16a34a">left leg — J2 chain</text>
    <!-- feed from J2 up -->
    <path d="M690 480 L 705 480 L 705 148 L 720 148" fill="none" stroke="#111827" stroke-width="2"/>
    <path d="M690 500 L 710 500 L 710 128 L 720 128" fill="none" stroke="#c0392b" stroke-width="2"/>
    <path d="M690 520 L 715 520 L 715 108 L 720 108" fill="none" stroke="#2563eb" stroke-width="2"/>
  </g>
  <g font-size="8.5">
    <!-- servo template: box, label, left pins at +18(D),+38(V),+58(G) rel y=90 -->
    <!-- M1 -->
    <rect x="720" y="90" width="95" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="767" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">M1 · ID1</text>
    <text x="767" y="117" text-anchor="middle" fill="#166534">L hip roll</text>
    <text x="767" y="164" text-anchor="middle" font-size="7.5" fill="#6b7280">2 ports, paralleled</text>
    <line x1="815" y1="108" x2="830" y2="108" stroke="#2563eb" stroke-width="2"/>
    <line x1="815" y1="128" x2="830" y2="128" stroke="#c0392b" stroke-width="2"/>
    <line x1="815" y1="148" x2="830" y2="148" stroke="#111827" stroke-width="2"/>
    <!-- M2 -->
    <rect x="830" y="90" width="95" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="877" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">M2 · ID2</text>
    <text x="877" y="117" text-anchor="middle" fill="#166534">L hip pitch</text>
    <line x1="925" y1="108" x2="940" y2="108" stroke="#2563eb" stroke-width="2"/>
    <line x1="925" y1="128" x2="940" y2="128" stroke="#c0392b" stroke-width="2"/>
    <line x1="925" y1="148" x2="940" y2="148" stroke="#111827" stroke-width="2"/>
    <!-- M3 -->
    <rect x="940" y="90" width="95" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="987" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">M3 · ID3</text>
    <text x="987" y="117" text-anchor="middle" fill="#166534">L knee</text>
    <line x1="1035" y1="108" x2="1050" y2="108" stroke="#2563eb" stroke-width="2"/>
    <line x1="1035" y1="128" x2="1050" y2="128" stroke="#c0392b" stroke-width="2"/>
    <line x1="1035" y1="148" x2="1050" y2="148" stroke="#111827" stroke-width="2"/>
    <!-- M4 -->
    <rect x="1050" y="90" width="95" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1097" y="105" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">M4 · ID4</text>
    <text x="1097" y="117" text-anchor="middle" fill="#166534">L ankle</text>
    <text x="1097" y="150" text-anchor="middle" font-size="7.5" fill="#9ca3af">2nd port empty</text>

    <!-- row B y=690.. right leg -->
    <text x="712" y="682" font-size="11" font-weight="bold" fill="#ca8a04">right leg — J3 chain</text>
  </g>
  <g font-size="8.5">
    <path d="M690 555 L 705 555 L 705 748 L 720 748" fill="none" stroke="#111827" stroke-width="2"/>
    <path d="M690 575 L 710 575 L 710 728 L 720 728" fill="none" stroke="#c0392b" stroke-width="2"/>
    <path d="M690 595 L 715 595 L 715 708 L 720 708" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- M5..M8 row at y=690 -->
    <rect x="720" y="690" width="95" height="80" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="767" y="705" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#713f12">M5 · ID5</text>
    <text x="767" y="717" text-anchor="middle" fill="#854d0e">R hip roll</text>
    <text x="767" y="764" text-anchor="middle" font-size="7.5" fill="#6b7280">2 ports, paralleled</text>
    <line x1="815" y1="708" x2="830" y2="708" stroke="#2563eb" stroke-width="2"/>
    <line x1="815" y1="728" x2="830" y2="728" stroke="#c0392b" stroke-width="2"/>
    <line x1="815" y1="748" x2="830" y2="748" stroke="#111827" stroke-width="2"/>
    <rect x="830" y="690" width="95" height="80" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="877" y="705" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#713f12">M6 · ID6</text>
    <text x="877" y="717" text-anchor="middle" fill="#854d0e">R hip pitch</text>
    <line x1="925" y1="708" x2="940" y2="708" stroke="#2563eb" stroke-width="2"/>
    <line x1="925" y1="728" x2="940" y2="728" stroke="#c0392b" stroke-width="2"/>
    <line x1="925" y1="748" x2="940" y2="748" stroke="#111827" stroke-width="2"/>
    <rect x="940" y="690" width="95" height="80" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="987" y="705" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#713f12">M7 · ID7</text>
    <text x="987" y="717" text-anchor="middle" fill="#854d0e">R knee</text>
    <line x1="1035" y1="708" x2="1050" y2="708" stroke="#2563eb" stroke-width="2"/>
    <line x1="1035" y1="728" x2="1050" y2="728" stroke="#c0392b" stroke-width="2"/>
    <line x1="1035" y1="748" x2="1050" y2="748" stroke="#111827" stroke-width="2"/>
    <rect x="1050" y="690" width="95" height="80" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="1097" y="705" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#713f12">M8 · ID8</text>
    <text x="1097" y="717" text-anchor="middle" fill="#854d0e">R ankle</text>
    <text x="1097" y="750" text-anchor="middle" font-size="7.5" fill="#9ca3af">2nd port empty</text>
  </g>
  <!-- per-pin labels on first hop of each row -->
  <g font-size="8" fill="#6b7280">
    <text x="822" y="103">D</text><text x="822" y="124">V+</text><text x="822" y="144">G</text>
    <text x="822" y="703">D</text><text x="822" y="724">V+</text><text x="822" y="744">G</text>
  </g>

  <!-- ============ notes ============ -->
  <g font-size="10" fill="#374151">
    <rect x="35" y="380" width="290" height="230" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="50" y="402" font-size="11" font-weight="bold" fill="#1f2937">Electrical notes</text>
    <text x="50" y="422">• Servo lead: 3-pin Molex-5264-style, 150 mm,</text>
    <text x="58" y="436">black GND · red V+ · white/blue DATA.</text>
    <text x="50" y="454">• ST3215 (12 V class): stall 2.7 A, idle 0.18 A each.</text>
    <text x="58" y="468">Gait worst case ≈ 2–3 servos near stall →</text>
    <text x="58" y="482">budget ~10 A transient. XT30 = 30 A ✓, 20 AWG ✓.</text>
    <text x="50" y="500">• DATA is ONE shared net — servo IDs must be</text>
    <text x="58" y="514">unique (set 1–8 one at a time at bring-up).</text>
    <text x="50" y="532">• VBAT is unregulated battery straight to the</text>
    <text x="58" y="546">servo bus — torque tracks battery voltage.</text>
    <text x="50" y="564">• Land by 10.5 V (3.5 V/cell); OLED shows VBAT.</text>
    <text x="50" y="582">• GoPro MAX: self-powered, no connection.</text>
    <text x="50" y="600">• Balance lead: charging only, tape it in the bay.</text>
  </g>
</svg>
