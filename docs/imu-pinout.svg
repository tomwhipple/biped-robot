<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="700" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Bimo biped — IMU pinout</text>
  <text x="540" y="49" text-anchor="middle" font-size="11" fill="#6b7280">GY-BNO085 breakout → Waveshare Servo Driver with ESP32 · I²C @ 400 kHz · addr 0x4A · 4 wires, all soldered</text>

  <!-- ============ warning banner ============ -->
  <rect x="40" y="64" width="1000" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="86" font-size="12" font-weight="bold" fill="#991b1b">There is no I²C header on this board.</text>
  <text x="292" y="86" font-size="12" fill="#7f1d1d">Its only connectors are CN1 (barrel), H1 (LED out), H2/H3 (servo bus) and USB-C. All four IMU wires are solder joints.</text>

  <!-- ============ IMU breakout ============ -->
  <g>
    <rect x="40" y="130" width="290" height="420" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="185" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">GY-BNO085 breakout</text>
    <text x="185" y="169" text-anchor="middle" font-size="9" fill="#166534">Teyleten · Amazon B0CL26J81F · BOM item 18</text>
    <text x="185" y="182" text-anchor="middle" font-size="9" fill="#166534">BNO085 SiP · SH-2 fusion on-chip · 3.3 V logic</text>

    <line x1="60" y1="194" x2="310" y2="194" stroke="#bbf7d0" stroke-width="1"/>
    <text x="60" y="212" font-size="10" font-weight="bold" fill="#14532d">REQUIRED — the four wires</text>

    <!-- required pins -->
    <g font-size="11">
      <rect x="60" y="220" width="250" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
      <circle cx="76" cy="235" r="5" fill="#c33b2c"/>
      <text x="92" y="239" font-weight="bold" fill="#1f2937">VIN</text>
      <text x="150" y="239" font-size="10" fill="#4b5563">3.3–5 V supply in</text>

      <rect x="60" y="256" width="250" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
      <circle cx="76" cy="271" r="5" fill="#26221f"/>
      <text x="92" y="275" font-weight="bold" fill="#1f2937">GND</text>
      <text x="150" y="275" font-size="10" fill="#4b5563">common ground</text>

      <rect x="60" y="292" width="250" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
      <circle cx="76" cy="307" r="5" fill="#2b62c3"/>
      <text x="92" y="311" font-weight="bold" fill="#1f2937">SDA</text>
      <text x="150" y="311" font-size="10" fill="#4b5563">I²C data</text>

      <rect x="60" y="328" width="250" height="30" rx="4" fill="#ffffff" stroke="#86efac"/>
      <circle cx="76" cy="343" r="5" fill="#e0c33c" stroke="#a16207"/>
      <text x="92" y="347" font-weight="bold" fill="#1f2937">SCL</text>
      <text x="150" y="347" font-size="10" fill="#4b5563">I²C clock</text>
    </g>

    <line x1="60" y1="374" x2="310" y2="374" stroke="#bbf7d0" stroke-width="1"/>
    <text x="60" y="392" font-size="10" font-weight="bold" fill="#14532d">LEAVE UNCONNECTED for I²C</text>
    <g font-size="10" fill="#6b7280">
      <text x="60" y="412">RST — active-low reset; tie nothing, the SiP self-boots</text>
      <text x="60" y="429">INT — data-ready; optional, see note 3</text>
      <text x="60" y="446">CS  — SPI chip select (SPI mode only)</text>
      <text x="60" y="463">SDO — SPI data out; doubles as SA0 address bit</text>
      <text x="60" y="480" fill="#9ca3af">P0 / P1 — protocol select; both low = I²C (usually</text>
      <text x="60" y="494" fill="#9ca3af">hard-tied or solder-jumpered low from the factory)</text>
    </g>
    <text x="60" y="522" font-size="9" font-style="italic" fill="#a16207">Header order differs between clone batches —</text>
    <text x="60" y="535" font-size="9" font-style="italic" fill="#a16207">match names off the silkscreen, not position.</text>
  </g>

  <!-- ============ wires ============ -->
  <g stroke-width="2.5" fill="none">
    <path d="M330 235 H 480 V 250 H 700" stroke="#c33b2c"/>
    <path d="M330 271 H 460 V 300 H 700" stroke="#26221f"/>
    <path d="M330 307 H 440 V 350 H 700" stroke="#2b62c3"/>
    <path d="M330 343 H 420 V 400 H 700" stroke="#a16207"/>
  </g>
  <g font-size="10" font-weight="bold">
    <text x="505" y="243" fill="#991b1b">3V3</text>
    <text x="505" y="293" fill="#111827">GND</text>
    <text x="505" y="343" fill="#1e40af">SDA → IO21</text>
    <text x="505" y="393" fill="#854d0e">SCL → IO22</text>
  </g>
  <text x="420" y="580" font-size="10" fill="#6b7280">4× jumper wire, ~150 mm — IMU rides the tower-top</text>
  <text x="420" y="595" font-size="10" fill="#6b7280">imu_carrier, board sits on the deck below (assembly.md §9b)</text>

  <!-- ============ driver board ============ -->
  <g>
    <rect x="700" y="130" width="340" height="470" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="870" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">U1 · Servo Driver with ESP32</text>
    <text x="870" y="169" text-anchor="middle" font-size="9" fill="#3b5bdb">Waveshare · no GPIO broken out</text>

    <!-- ESP32 module -->
    <rect x="716" y="186" width="200" height="240" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="816" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">M1 · ESP-32S module</text>
    <text x="816" y="220" text-anchor="middle" font-size="9" fill="#3b5bdb">solder to the castellated pads</text>

    <!-- pads -->
    <g font-size="10">
      <circle cx="700" cy="250" r="5" fill="#c33b2c"/>
      <text x="730" y="254" font-weight="bold" fill="#1f2937">3V3</text>
      <text x="786" y="254" font-size="9" fill="#4b5563">AMS1117 output</text>

      <circle cx="700" cy="300" r="5" fill="#26221f"/>
      <text x="730" y="304" font-weight="bold" fill="#1f2937">GND</text>
      <text x="786" y="304" font-size="9" fill="#4b5563">any ground pad</text>

      <circle cx="700" cy="350" r="5" fill="#2b62c3"/>
      <text x="730" y="354" font-weight="bold" fill="#1f2937">IO21</text>
      <text x="786" y="354" font-size="9" fill="#4b5563">SDA</text>

      <circle cx="700" cy="400" r="5" fill="#e0c33c" stroke="#a16207"/>
      <text x="730" y="404" font-weight="bold" fill="#1f2937">IO22</text>
      <text x="786" y="404" font-size="9" fill="#4b5563">SCL</text>
    </g>

    <!-- shared bus note -->
    <rect x="716" y="436" width="308" height="52" rx="5" fill="#ffffff" stroke="#93c5fd"/>
    <text x="726" y="454" font-size="10" font-weight="bold" fill="#1e3a8a">Same two pins already carry the OLED</text>
    <text x="726" y="469" font-size="9" fill="#3b5bdb">SSD1306 128×32 @ 0x3C · BNO085 @ 0x4A — no conflict.</text>
    <text x="726" y="482" font-size="9" fill="#3b5bdb">4.7 kΩ pull-ups to 3V3 are already fitted. Add none.</text>

    <!-- H1 -->
    <rect x="716" y="498" width="308" height="48" rx="5" fill="#fffbeb" stroke="#d97706"/>
    <text x="726" y="516" font-size="10" font-weight="bold" fill="#92400e">H1 · 3-pin on the back = 1 5V · 2 GND · 3 LED-OUT</text>
    <text x="726" y="530" font-size="9" fill="#b45309">WS2812B expansion output. Pins 1–2 are a solder-free 5 V tap</text>
    <text x="726" y="542" font-size="9" fill="#b45309">for VIN if the carrier's regulator is confirmed. Never I²C.</text>

    <!-- other connectors -->
    <text x="726" y="568" font-size="9" fill="#6b7280">CN1 barrel 6–12 V · H2/H3 servo bus (GND · V+ · DATA) · USB-C</text>
    <text x="726" y="582" font-size="9" fill="#9ca3af">— none of them expose I²C or 3V3.</text>
  </g>

  <!-- ============ footnotes ============ -->
  <g font-size="10" fill="#4b5563">
    <text x="40" y="628" font-weight="bold" fill="#1f2937">1</text>
    <text x="56" y="628">Power from 3V3, not 5 V, unless a bench check confirms the carrier regulates VIN — the BNO085 SiP is a 3.6 V-max part.</text>
    <text x="40" y="645" font-weight="bold" fill="#1f2937">2</text>
    <text x="56" y="645">Confirm the address with a bus scan before trusting it: SA0 low = 0x4A, SA0 high = 0x4B (firmware tries both).</text>
    <text x="40" y="662" font-weight="bold" fill="#1f2937">3</text>
    <text x="56" y="662">INT is optional — polled SH-2 reads work without it. To use it, solder to any unused module pad (IO4/IO5 are unconnected here) and meter it first.</text>
    <text x="40" y="679" font-weight="bold" fill="#1f2937">4</text>
    <text x="56" y="679">Board facts read off Waveshare's schematic (URL in firmware/main/board.h), 2026-07-28. Breakout facts unverified until the part is in hand.</text>
  </g>
</svg>
