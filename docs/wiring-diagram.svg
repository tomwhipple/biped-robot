<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Bimo biped — wiring diagram</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#6b7280">8× Feetech/Waveshare ST3215 on one serial bus · Waveshare “Servo Driver with ESP32” · 3S LiPo</text>

  <!-- legend -->
  <g font-size="11" fill="#374151">
    <line x1="40" y1="600" x2="80" y2="600" stroke="#c0392b" stroke-width="3"/>
    <text x="86" y="604">battery power (V+)</text>
    <line x1="230" y1="600" x2="270" y2="600" stroke="#111827" stroke-width="3"/>
    <text x="276" y="604">ground</text>
    <line x1="360" y1="600" x2="400" y2="600" stroke="#2563eb" stroke-width="3"/>
    <text x="406" y="604">3-pin servo bus (V+ · GND · DATA, half-duplex TTL @ 1 Mbaud)</text>
    <line x1="770" y1="600" x2="810" y2="600" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="816" y="604">WiFi / USB</text>
  </g>

  <!-- laptop -->
  <g>
    <rect x="60" y="90" width="170" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="145" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Laptop</text>
    <text x="145" y="138" text-anchor="middle" font-size="11" fill="#4b5563">policy / teleop / debug</text>
  </g>
  <path d="M230 112 C 300 100, 330 130, 356 168" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="103" font-size="11" fill="#6b7280">WiFi (AP mode, web UI + telemetry)</text>
  <path d="M230 148 C 280 160, 310 190, 342 214" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="248" y="182" font-size="11" fill="#6b7280">USB-C · UART0 @ 115200</text>
  <text x="248" y="196" font-size="11" fill="#6b7280">(flash, serial bridge)</text>

  <!-- battery -->
  <g>
    <rect x="40" y="330" width="170" height="86" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
    <text x="125" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">3S LiPo 11.1 V</text>
    <text x="125" y="374" text-anchor="middle" font-size="11" fill="#7f1d1d">650–1000 mAh · XT30</text>
    <text x="125" y="390" text-anchor="middle" font-size="11" fill="#7f1d1d">≤ 75 × 35 × 16 mm bay</text>
    <text x="125" y="406" text-anchor="middle" font-size="10" fill="#b91c1c">(2S 7.4 V also supported)</text>
  </g>

  <!-- switch -->
  <rect x="240" y="348" width="70" height="40" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="275" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">switch</text>
  <text x="275" y="380" text-anchor="middle" font-size="10" fill="#92400e">inline XT30</text>

  <line x1="210" y1="360" x2="240" y2="360" stroke="#c0392b" stroke-width="3"/>
  <line x1="210" y1="376" x2="240" y2="376" stroke="#111827" stroke-width="3"/>
  <line x1="310" y1="360" x2="352" y2="360" stroke="#c0392b" stroke-width="3"/>
  <line x1="310" y1="376" x2="352" y2="376" stroke="#111827" stroke-width="3"/>
  <text x="318" y="392" font-size="10" fill="#6b7280">20 AWG</text>

  <!-- driver board -->
  <g>
    <rect x="352" y="200" width="270" height="250" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="487" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Servo Driver with ESP32</text>
    <text x="487" y="242" text-anchor="middle" font-size="10" fill="#3b5bdb">Waveshare · 65 × 30 mm · holes Ø2.75 @ 58 × 23</text>
    <rect x="368" y="252" width="238" height="30" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="487" y="271" text-anchor="middle" font-size="11" fill="#1f2937">VIN 6–12.6 V — screw terminal / DC 5.5×2.1</text>
    <rect x="368" y="288" width="238" height="30" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="487" y="307" text-anchor="middle" font-size="11" fill="#1f2937">ESP32-WROOM-32 · WiFi + BT · web UI</text>
    <rect x="368" y="324" width="238" height="30" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="487" y="343" text-anchor="middle" font-size="11" fill="#1f2937">OLED: bus voltage · IP · servo count</text>
    <rect x="368" y="360" width="238" height="30" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="487" y="379" text-anchor="middle" font-size="11" fill="#1f2937">UART1 → servo bus @ 1 Mbaud</text>
    <rect x="368" y="396" width="112" height="34" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="424" y="417" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">bus port A</text>
    <rect x="494" y="396" width="112" height="34" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="550" y="417" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">bus port B</text>
    <text x="487" y="443" text-anchor="middle" font-size="9" fill="#3b5bdb">A and B are the same electrical bus (paralleled)</text>
  </g>

  <!-- left leg chain (port A) -->
  <path d="M424 430 C 424 480, 560 500, 660 500" fill="none" stroke="#2563eb" stroke-width="3"/>
  <g font-size="11">
    <rect x="660" y="478" width="120" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="720" y="496" text-anchor="middle" font-weight="bold" fill="#14532d">ID 1 · L hip roll</text>
    <text x="720" y="512" text-anchor="middle" font-size="10" fill="#166534">ST3215</text>
    <line x1="780" y1="500" x2="820" y2="500" stroke="#2563eb" stroke-width="3"/>
    <rect x="820" y="478" width="120" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="880" y="496" text-anchor="middle" font-weight="bold" fill="#14532d">ID 2 · L hip pitch</text>
    <text x="880" y="512" text-anchor="middle" font-size="10" fill="#166534">ST3215</text>
    <path d="M880 522 C 880 556, 780 556, 745 556 L 720 556" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="660" y="534" width="120" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="720" y="552" text-anchor="middle" font-weight="bold" fill="#14532d">ID 3 · L knee</text>
    <text x="720" y="568" text-anchor="middle" font-size="10" fill="#166534">ST3215</text>
    <line x1="660" y1="556" x2="610" y2="556" stroke="#2563eb" stroke-width="3"/>
    <rect x="490" y="534" width="120" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="550" y="552" text-anchor="middle" font-weight="bold" fill="#14532d">ID 4 · L ankle</text>
    <text x="550" y="568" text-anchor="middle" font-size="10" fill="#166534">ST3215</text>
  </g>
  <text x="640" y="470" font-size="11" font-weight="bold" fill="#2563eb">left leg chain</text>

  <!-- right leg chain (port B) -->
  <g font-size="11">
    <rect x="660" y="90" width="120" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="720" y="108" text-anchor="middle" font-weight="bold" fill="#713f12">ID 5 · R hip roll</text>
    <text x="720" y="124" text-anchor="middle" font-size="10" fill="#854d0e">ST3215</text>
    <line x1="780" y1="112" x2="820" y2="112" stroke="#2563eb" stroke-width="3"/>
    <rect x="820" y="90" width="120" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="880" y="108" text-anchor="middle" font-weight="bold" fill="#713f12">ID 6 · R hip pitch</text>
    <text x="880" y="124" text-anchor="middle" font-size="10" fill="#854d0e">ST3215</text>
    <path d="M880 134 C 880 168, 780 168, 745 168 L 720 168" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="660" y="146" width="120" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="720" y="164" text-anchor="middle" font-weight="bold" fill="#713f12">ID 7 · R knee</text>
    <text x="720" y="180" text-anchor="middle" font-size="10" fill="#854d0e">ST3215</text>
    <line x1="660" y1="168" x2="610" y2="168" stroke="#2563eb" stroke-width="3"/>
    <rect x="490" y="146" width="120" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="550" y="164" text-anchor="middle" font-weight="bold" fill="#713f12">ID 8 · R ankle</text>
    <text x="550" y="180" text-anchor="middle" font-size="10" fill="#854d0e">ST3215</text>
  </g>
  <path d="M550 430 C 550 452, 570 452, 600 452 L 628 452 C 640 452, 640 440, 640 420 L 640 130 C 640 118, 648 112, 660 112" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="632" y="300" font-size="11" font-weight="bold" fill="#2563eb" transform="rotate(-90 632 300)">right leg chain</text>

  <!-- gopro note -->
  <rect x="60" y="470" width="230" height="60" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="175" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">GoPro MAX (154 g)</text>
  <text x="175" y="512" text-anchor="middle" font-size="11" fill="#6b7280">self-powered — no wiring to robot</text>
</svg>
