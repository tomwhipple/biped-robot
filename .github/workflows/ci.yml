# CI disabled (2026-09-16, Tom): all acceptance gates moved to the local
# pre-push hook (.githooks/pre-push). This file is kept only so the workflow
# name stays registered for easy re-enable; it never auto-fires.
#
# Gate coverage now lives in .githooks/pre-push:
#   host-tests/console  ->  make -C firmware/host check
#   link-tests          ->  python3 -m pytest tests/ -q
#   cmake-ctest         ->  cmake configure / build / ctest  (hard when cmake
#                           is installed; skips with a note otherwise)
#   esp32-build         ->  idf.py build (the project in firmware/); needs ESP-IDF on
#                           PATH or IDF_PATH (SKIP_ESP32=1 overrides)
#   clang-tidy          ->  run-clang-tidy over the host build, when clang-tidy
#                           is installed (WarningsAsErrors per .clang-tidy)
#   clang-tidy-gui      ->  firmware/host/clang-tidy-gui.sh, when clang-tidy
#                           is installed (runs `make deps` first)
#   cppcheck            ->  firmware/host/cppcheck.sh, when cppcheck is
#                           installed (wrapper fails on any finding)
# Toolchain-guarded gates SKIP with a note when the tool is absent; install
# the toolchain to enforce them locally.
#
# To re-enable CI, restore the original `on:` triggers and jobs. The prior
# config is preserved in git history on main.
name: ci (disabled)

on:
  workflow_dispatch:

jobs: {}
